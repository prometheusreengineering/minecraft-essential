name: Verity

# Builds the patch, then boots it next to the Essential build pinned in verity.json (each Minecraft version and
# loader that build ships for on Modrinth) with Verity, headless, on Linux and Windows. See verity/VerityChecks.java.

on:
  push:
    branches: [main]
    paths-ignore: &unaffected
      # Nothing the build or the Verity run reads. src/main/resources (cosmetics.json included) goes into the jar,
      # so it isn't here.
      - "**.md"
      - LICENSE
      # Local development setup: Nix, direnv and IntelliJ run configurations.
      - flake.nix
      - flake.lock
      - .envrc
      - .run/**
  pull_request:
    paths-ignore: *unaffected
  workflow_dispatch:

permissions:
  contents: read

env:
  # Essential build the code compiles against (lib/essential.mock.jar, the Forge 1.8.9 jar; not redistributed here).
  ESSENTIAL_VERSION: "1.5.2"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Fetch Essential ${{ env.ESSENTIAL_VERSION }} (compile-time only)
        run: |
          meta="$(curl -fsSL "https://api.essential.gg/mods/v1/essential:essential/versions/$ESSENTIAL_VERSION/platforms/forge_1-8-9/download")"
          curl -fsSL "$(jq -r .url <<<"$meta")" -o lib/essential.mock.jar
          echo "$(jq -r .checksum <<<"$meta")  lib/essential.mock.jar" | md5sum -c -
      - name: Build
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-jar
          path: target/prometheus-*-essential.jar
          if-no-files-found: error

  # Verity's plan mode decides the runners: how many, the Linux/Windows split, which targets each gets, and the
  # cache groups. It learns run times from this workflow's last finished run.
  plan:
    name: Plan
    needs: build
    runs-on: ubuntu-latest
    # Only planning reads earlier runs' timings and the cache list. A job's permissions replace the workflow's.
    permissions:
      contents: read
      actions: read
    outputs:
      prepare: ${{ steps.plan.outputs.prepare }}
      shards: ${{ steps.plan.outputs.shards }}
      has-prepare: ${{ steps.plan.outputs.has-prepare }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prometheus-jar
          path: target
      - id: plan
        uses: prometheusreengineering/verity@v1
        with:
          mode: plan
          profile: verity.json
          os: linux,windows

  # Fills the caches of each cache group that has none yet (about once a week).
  prepare:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.has-prepare == 'true' }}
    # The test jobs can still download what they need themselves.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.prepare) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prometheus-jar
          path: target
      - uses: prometheusreengineering/verity@v1
        with:
          profile: verity.json
          job: ${{ toJSON(matrix) }}

  verity:
    name: ${{ matrix.name }}
    needs: [plan, prepare]
    # Also when prepare was skipped because every cache exists.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prometheus-jar
          path: target
      - name: Run Verity
        uses: prometheusreengineering/verity@v1
        with:
          profile: verity.json
          job: ${{ toJSON(matrix) }}
