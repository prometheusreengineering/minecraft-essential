name: Verity

# Builds the patch, then boots it next to the Essential build pinned in verity.json (each Minecraft version and
# loader that build ships for on Modrinth) with Verity, headless, on Linux and Windows. See verity/VerityChecks.java.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verity-${{ github.ref }}
  cancel-in-progress: true

env:
  # Essential build the code compiles against (lib/essential.mock.jar, the Forge 1.8.9 jar; not redistributed here).
  ESSENTIAL_VERSION: "1.5.2"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Fetch Essential ${{ env.ESSENTIAL_VERSION }} (compile-time only)
        run: |
          meta="$(curl -fsSL "https://api.essential.gg/mods/v1/essential:essential/versions/$ESSENTIAL_VERSION/platforms/forge_1-8-9/download")"
          curl -fsSL "$(jq -r .url <<<"$meta")" -o lib/essential.mock.jar
          echo "$(jq -r .checksum <<<"$meta")  lib/essential.mock.jar" | md5sum -c -
      - name: Build
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-jar
          path: target/prometheus-*-essential.jar
          if-no-files-found: error

  # Fills the one cache per OS that every loader job below restores.
  prepare:
    name: Prepare (${{ matrix.os }})
    needs: build
    # The test jobs can still download what they need themselves.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prometheus-jar
          path: target
      - name: Prepare Verity
        uses: prometheusreengineering/verity@feat/cache-prepare
        with:
          mode: prepare
          profile: verity.json

  verity:
    name: Verity ${{ matrix.loader }} (${{ matrix.os }})
    needs: [build, prepare]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        loader: [fabric, forge, neoforge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prometheus-jar
          path: target
      - name: Run Verity
        uses: prometheusreengineering/verity@feat/cache-prepare
        with:
          profile: verity.json
          only: ${{ matrix.loader }}
          parallel: "3"
