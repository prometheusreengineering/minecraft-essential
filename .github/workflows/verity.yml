name: Verity

# Builds the patch, then boots it with the latest Essential release on every Minecraft version and loader Essential
# ships for, headless on Linux and Windows, with Verity, and checks in game that the patch works
# (verity/VerityChecks.java, verity/GameChecks.java).
#
# No client signs in. Each test job serves Essential's side from cm-replay on loopback: a session recorded every hour
# by minecraft-essential-data (plain Essential, signed in there, on main only), cosmetics side only and with the
# account's own data replaced. So this workflow needs no account, no token and no environment, and pull requests,
# forks included, need no approval beyond GitHub's own for first-time contributors.

on:
  push:
    branches: [main]
    paths-ignore: &unaffected
      # Nothing the build or the Verity run reads. src/main/resources (cosmetics.json included) goes into the jar,
      # so it isn't here.
      - "**.md"
      - LICENSE
      # Local development setup: Nix, direnv and IntelliJ run configurations.
      - flake.nix
      - flake.lock
      - .envrc
      - .run/**
      - verity-live.json
  pull_request:
    paths-ignore: *unaffected
  workflow_dispatch:

permissions:
  contents: read

env:
  # recording.jsonl, cm-replay.jar and manifest.json, replaced hourly.
  SNAPSHOT: https://raw.githubusercontent.com/prometheusreengineering/minecraft-essential-data/snapshot

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      essential: ${{ steps.essential.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The latest release, for compiling (MixinTargetsTest checks every target against it) and for every test job.
      - name: Fetch the latest Essential (compile-time only)
        id: essential
        run: |
          version="$(curl -fsSL --retry 3 'https://api.modrinth.com/v2/project/essential/version' \
            | jq -r '[.[] | select(.version_type == "release")] | sort_by(.date_published) | last | .version_number')"
          [ -n "$version" ] && [ "$version" != null ] || { echo "::error::No Essential release on Modrinth."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          meta="$(curl -fsSL --retry 3 "https://api.essential.gg/mods/v1/essential:essential/versions/$version/platforms/forge_1-8-9/download")"
          curl -fsSL --retry 3 "$(jq -r .url <<<"$meta")" -o lib/essential.mock.jar
          echo "$(jq -r .checksum <<<"$meta")  lib/essential.mock.jar" | md5sum -c -
          echo "Essential $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and unit test
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-jar
          path: target/prometheus-*-essential.jar
          if-no-files-found: error

  # Verity's plan mode decides the runners: how many, the Linux/Windows split, which targets each gets, and the
  # cache groups. It learns run times from this workflow's last finished run.
  plan:
    name: Plan
    needs: build
    runs-on: ubuntu-latest
    # Only planning reads earlier runs' timings and the cache list. A job's permissions replace the workflow's.
    permissions:
      contents: read
      actions: read
    outputs:
      prepare: ${{ steps.plan.outputs.prepare }}
      shards: ${{ steps.plan.outputs.shards }}
      has-prepare: ${{ steps.plan.outputs.has-prepare }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prometheus-jar
          path: target
      # Exact, so targets without this build are skipped (onlyTargetsWithAllMods), as Prometheus needs a recent one.
      - name: Use Essential ${{ needs.build.outputs.essential }}
        env:
          ESSENTIAL: ${{ needs.build.outputs.essential }}
        run: |
          jq --arg v "$ESSENTIAL" '(.mods[] | select(.modrinth == "essential")).version = $v' verity.json > profile.json
          mv profile.json verity.json
      - id: plan
        uses: prometheusreengineering/verity@v1
        with:
          mode: plan
          profile: verity.json
          os: linux,windows

  # Fills the caches of each cache group that has none yet (about once a week, and after each Essential release).
  prepare:
    name: ${{ matrix.name }}
    needs: [build, plan]
    if: ${{ needs.plan.outputs.has-prepare == 'true' }}
    # The test jobs can still download what they need themselves.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.prepare) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prometheus-jar
          path: target
      - name: Use Essential ${{ needs.build.outputs.essential }}
        shell: bash
        env:
          ESSENTIAL: ${{ needs.build.outputs.essential }}
        run: |
          jq --arg v "$ESSENTIAL" '(.mods[] | select(.modrinth == "essential")).version = $v' verity.json > profile.json
          mv profile.json verity.json
      - uses: prometheusreengineering/verity@v1
        with:
          profile: verity.json
          job: ${{ toJSON(matrix) }}

  verity:
    name: ${{ matrix.name }}
    needs: [build, plan, prepare]
    # Also when prepare was skipped because every cache exists.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prometheus-jar
          path: target
      - name: Use Essential ${{ needs.build.outputs.essential }}
        shell: bash
        env:
          ESSENTIAL: ${{ needs.build.outputs.essential }}
        run: |
          jq --arg v "$ESSENTIAL" '(.mods[] | select(.modrinth == "essential")).version = $v' verity.json > profile.json
          mv profile.json verity.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # A stale snapshot still tests the patch, so a broken hourly job warns instead of failing every pull request.
      - name: Fetch the recorded session
        shell: bash
        run: |
          mkdir -p replay
          for f in recording.jsonl cm-replay.jar manifest.json; do
            curl -fsSL --retry 5 --retry-all-errors "$SNAPSHOT/$f" -o "replay/$f"
          done
          cat replay/manifest.json
          recorded="$(jq -r .recordedAt replay/manifest.json)"
          age=$(( $(date -u +%s) - $(date -u -d "$recorded" +%s) ))
          if [ "$age" -gt 10800 ]; then
            echo "::warning::The recorded session is $((age / 3600)) h old ($recorded). Check minecraft-essential-data's Record workflow."
          fi
          echo "Replaying the session recorded $recorded with Essential $(jq -r .essential replay/manifest.json)." >> "$GITHUB_STEP_SUMMARY"
      # It has to outlive this step; the runner ends it with the job. On Windows the runner also ends every process a
      # step started (a job object) when the step ends, so there it's started through WMI, outside that job. A WMI
      # process gets the machine's environment, not the step's, hence java's full path.
      - name: Start cm-replay
        shell: pwsh
        run: |
          if ($IsWindows) {
            $java = Join-Path $env:JAVA_HOME 'bin\java.exe'
            $cmd = "cmd /c `"`"$java`" -jar replay\cm-replay.jar replay\recording.jsonl --unanswered replay\unanswered.txt > replay\cm-replay.log 2> replay\cm-replay.err`""
            $r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $cmd; CurrentDirectory = $PWD.Path }
            if ($r.ReturnValue -ne 0) { Write-Error "Win32_Process.Create returned $($r.ReturnValue)"; exit 1 }
          } else {
            Start-Process -FilePath java -ArgumentList '-jar', 'replay/cm-replay.jar', 'replay/recording.jsonl', '--unanswered', 'replay/unanswered.txt' `
              -RedirectStandardOutput replay/cm-replay.log -RedirectStandardError replay/cm-replay.err
          }
          foreach ($i in 1..60) {
            try { [System.Net.Sockets.TcpClient]::new('127.0.0.1', 47801).Dispose(); Get-Content replay/cm-replay.log; exit 0 } catch { Start-Sleep 1 }
          }
          Get-Content replay/cm-replay.log, replay/cm-replay.err -ErrorAction SilentlyContinue
          Write-Error 'cm-replay did not start'
      - name: Check cm-replay outlived its step
        shell: pwsh
        run: |
          try { [System.Net.Sockets.TcpClient]::new('127.0.0.1', 47801).Dispose() }
          catch { Get-Content replay/cm-replay.log, replay/cm-replay.err -ErrorAction SilentlyContinue; Write-Error 'cm-replay stopped with its step'; exit 1 }
      - name: Run Verity
        uses: prometheusreengineering/verity@v1
        with:
          profile: verity.json
          job: ${{ toJSON(matrix) }}
      - name: Requests cm-replay had no recorded answer for
        if: always()
        shell: bash
        run: |
          cat replay/cm-replay.err 2>/dev/null || true
          if [ -s replay/unanswered.txt ]; then
            { echo "### Requests cm-replay had no recorded answer for"; echo '```'; cat replay/unanswered.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat replay/unanswered.txt
          fi
